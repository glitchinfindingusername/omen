    }

    h1, h2, h3, .logo { font-family: var(--font-serif); font-weight: 600; color: var(--text-main); }
    a { text-decoration: none; color: inherit; transition: opacity 0.2s ease; }
    a:hover { opacity: 0.7; }
    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 2rem; }

    /* --- Header & Nav --- */
    #header { padding: 2rem 0; border-bottom: 1px solid #EAEAEA; background: #fff; }
    .header-inner { max-width: var(--max-width); margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; letter-spacing: -0.02em; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); }
    .nav-links a:hover, .nav-links a.active { color: var(--text-main); }

    /* --- Archive Header --- */
    .archive-header { padding: 4rem 0 2rem; text-align: center; }
    .archive-header h1 { font-size: 3rem; margin-bottom: 1rem; }
    .archive-header p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

    /* --- Filter System --- */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;
      margin-bottom: 3rem; padding: 1rem 0; border-bottom: 1px solid #EAEAEA;
    }
    .filter-btn {
      background: none; border: 1px solid #CCC; padding: 0.5rem 1.2rem;
      border-radius: 50px; font-family: var(--font-sans); font-size: 0.9rem;
      color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

   /* --- Horizontal Grid --- */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-bottom: 6rem;
      align-items: start; /* Prevents short cards from stretching awkwardly */
    }
    @media (max-width: 900px) { .media-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .media-grid { grid-template-columns: 1fr; } }
    
    .media-item {
      display: flex;
      flex-direction: column;
      height: 100%; /* Makes all cards in a row equal height */
      background: #fff;
      border: 1px solid #EAEAEA;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .media-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    .media-item img {
      width: 100%;
      height: 250px; /* Forces all thumbnail images to be the exact same height */
      object-fit: cover; /* Crops the image elegantly without squishing it */
      object-position: top; /* Ensures the newspaper headline stays visible at the top */
      border-bottom: 1px solid #EAEAEA;
    }
    .media-caption { 
      padding: 1.5rem; 
      display: flex;
      flex-direction: column;
      flex-grow: 1; /* Pushes the content to fill the remaining card space */
    }
    .media-caption h3 { font-size: 1.1rem; margin-bottom: 0.5rem; line-height: 1.3; }
    .media-meta { font-size: 0.85rem; color: var(--text-muted); margin-top: auto; /* Pushes the date to the very bottom alignment */ }
    
    /* --- Load More Button --- */
    .load-more-container {
      text-align: center;
      margin-top: -2rem;
      margin-bottom: 6rem;
    }
    .btn-load-more {
      padding: 0.8rem 2.5rem;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-load-more:hover {
      background: var(--accent);
      color: #fff;
    }

    /* --- Lightbox Modal --- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; z-index: 2000;
      padding: 2rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: #fff; width: 100%; max-width: 1000px;
      max-height: 90vh; border-radius: 8px; overflow: hidden;
      display: flex; position: relative;
    }
    @media (max-width: 768px) { .modal-content { flex-direction: column; overflow-y: auto; } }

    .modal-image-col img { max-width: 100%; max-height: 80vh; object-fit: contain; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    .modal-text-col { flex: 1; padding: 3rem 2rem; display: flex; flex-direction: column; border-left: 1px solid #EAEAEA; }
    .modal-close { position: absolute; top: 1rem; right: 1.5rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; }
    .modal-close:hover { color: #333; }
    
    .modal-topic { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 600; margin-bottom: 1rem; }
    .modal-title-marathi { font-family: var(--font-serif); font-size: 1.5rem; margin-bottom: 0.5rem; }

    .modal-details p { margin-bottom: 0.5rem; font-size: 0.95rem; }
    .modal-details strong { color: var(--text-main); }

    /* --- Footer --- */
    #footer { text-align: center; padding: 4rem 0; border-top: 1px solid #EAEAEA; color: var(--text-muted); font-size: 0.9rem; }

    const grid = document.getElementById('media-grid');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-select');
    const loadMoreContainer = document.getElementById('load-more-container');
    const loadMoreBtn = document.getElementById('load-more-btn');
    
    // Modal Elements
    const modal = document.getElementById('media-modal');
    const modalClose = document.getElementById('modal-close');
    const modalImg = document.getElementById('modal-img');
    const modalTopic = document.getElementById('modal-topic');
    const modalTitleMarathi = document.getElementById('modal-title-marathi');
    const modalTitleEnglish = document.getElementById('modal-title-english');
    const modalPub = document.getElementById('modal-pub');
    const modalDate = document.getElementById('modal-date');
    const modalLang = document.getElementById('modal-lang');

    // State Variables
    let currentFilter = 'all';
    let searchQuery = '';
    let currentSort = 'newest';
    let itemsToDisplay = 9; // Show 9 items initially

    function renderMedia(data) {
      grid.innerHTML = '';
      if(data.length === 0) {
        grid.innerHTML = '<p style="color:#666; padding: 2rem 0; grid-column: 1 / -1; text-align: center;">No results found.</p>';
        return;
      }
      data.forEach(item => {
        const clickAction = item.link ? `window.open('${item.link}', '_blank')` : `openModal(${item.id})`;

        const cardHTML = `
          <div class="media-item" onclick="${clickAction}">
            <img src="${item.image}" alt="${item.titleEnglish}">
            <div class="media-caption">
              <h3>${item.titleMarathi}</h3>
              <div class="media-meta">${item.publication} &bull; ${item.date}</div>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    window.openModal = function(id) {
      const item = mediaClippings.find(c => c.id === id);
      if(!item) return;
      modalImg.src = item.image;
      modalTopic.textContent = item.topic.replace('-', ' ');
      modalTitleMarathi.textContent = item.titleMarathi;
      modalTitleEnglish.textContent = `"${item.titleEnglish}"`;
      modalPub.textContent = item.publication;
      modalDate.textContent = item.date;
      modalLang.textContent = item.language;
      modal.classList.add('open');
      document.body.style.overflow = 'hidden'; 
    }

    modalClose.addEventListener('click', () => { modal.classList.remove('open'); document.body.style.overflow = ''; });
    modal.addEventListener('click', (e) => { if(e.target === modal) { modal.classList.remove('open'); document.body.style.overflow = ''; } });

    function processAndRenderData() {
      let processedData = [...mediaClippings];

      // 1. Filter
      if (currentFilter !== 'all') {
        processedData = processedData.filter(item => item.topic === currentFilter);
      }

      // 2. Search
      if (searchQuery.trim() !== '') {
        const query = searchQuery.toLowerCase();
        processedData = processedData.filter(item => {
          return item.titleMarathi.toLowerCase().includes(query) ||
                 item.titleEnglish.toLowerCase().includes(query) ||
                 item.publication.toLowerCase().includes(query);
        });
      }

      // 3. Sort
      processedData.sort((a, b) => {
        const dateA = new Date(a.date);
        const dateB = new Date(b.date);
        switch (currentSort) {
          case 'newest': return dateB - dateA;
          case 'oldest': return dateA - dateB;
          case 'az': return a.titleEnglish.localeCompare(b.titleEnglish);
          case 'publication': return a.publication.localeCompare(b.publication);
          default: return 0;
        }
      });

      // 4. Handle "Load More" logic
      const slicedData = processedData.slice(0, itemsToDisplay);
      renderMedia(slicedData);

      // Show or hide the button depending on remaining items
      if (processedData.length > itemsToDisplay) {
        loadMoreContainer.style.display = 'block';
      } else {
        loadMoreContainer.style.display = 'none';
      }
    }

    // --- EVENT LISTENERS ---

    // Load More Button
    loadMoreBtn.addEventListener('click', () => {
      itemsToDisplay += 9; // Add 9 more items to the view
      processAndRenderData();
    });

    // Filters (Resets display count to 9)
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        itemsToDisplay = 9; 
        processAndRenderData();
      });
    });

    // Search (Resets display count to 9)
    searchInput.addEventListener('input', (e) => { 
      searchQuery = e.target.value; 
      itemsToDisplay = 9;
      processAndRenderData(); 
    });

    // Sort (Resets display count to 9)
    sortSelect.addEventListener('change', (e) => { 
      currentSort = e.target.value; 
      itemsToDisplay = 9;
      processAndRenderData(); 
    });

    // Initial Load
    processAndRenderData();
  </script>
