<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Op-Eds Archive | Vivek H Sutar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* --- Base Variables & Core Styles (Same as Index) --- */
    :root {
      --bg-color: #FAFAFA;       
      --text-main: #222222;      
      --text-muted: #666666;     
      --accent: #2C3E50;         
      --font-serif: 'Lora', serif;
      --font-sans: 'Inter', sans-serif;
      --max-width: 1000px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-sans); background-color: var(--bg-color); color: var(--text-main); line-height: 1.7; -webkit-font-smoothing: antialiased; }
    h1, h2, h3, .logo { font-family: var(--font-serif); font-weight: 600; color: var(--text-main); }
    a { text-decoration: none; color: inherit; transition: opacity 0.2s ease; }
    a:hover { opacity: 0.7; }
    .container { max-width: var(--max-width); margin: 0 auto; padding: 0 2rem; }

    /* --- Header & Nav --- */
    #header { padding: 2rem 0; border-bottom: 1px solid #EAEAEA; background: #fff; }
    .header-inner { max-width: var(--max-width); margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.5rem; letter-spacing: -0.02em; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); }
    .nav-links a:hover, .nav-links a.active { color: var(--text-main); }

    /* --- Archive Header --- */
    .archive-header { padding: 4rem 0 2rem; text-align: center; }
    .archive-header h1 { font-size: 3rem; margin-bottom: 1rem; }
    .archive-header p { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

    /* --- Filter System --- */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 3rem;
      padding: 1rem 0;
      border-bottom: 1px solid #EAEAEA;
    }
    .filter-btn {
      background: none;
      border: 1px solid #CCC;
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* --- Op-Ed Grid --- */
    .oped-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      margin-bottom: 6rem;
    }
    .oped-card {
      background: #fff;
      border: 1px solid #EAEAEA;
      padding: 2rem;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: box-shadow 0.2s ease;
    }
    .oped-card:hover {
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .oped-title { font-size: 1.5rem; margin-bottom: 0.2rem; }
    .oped-meta { font-size: 0.9rem; color: var(--text-muted); display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    
    /* Badges */
    .badges { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge-print { background: #f0f4f8; color: #2C3E50; }
    .badge-online { background: #e6f7ff; color: #0050b3; }
    .badge-lang { border: 1px solid #ddd; color: var(--text-muted); }

    /* --- Footer --- */
    #footer { text-align: center; padding: 4rem 0; border-top: 1px solid #EAEAEA; color: var(--text-muted); font-size: 0.9rem; }
    /* --- Search & Sort Controls --- */
.controls-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 2rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid #EAEAEA;
}
.search-box { flex: 1; min-width: 250px; position: relative; }
.search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.search-box input {
  width: 100%; padding: 0.8rem 1rem 0.8rem 2.5rem; border: 1px solid #EAEAEA;
  border-radius: 50px; font-family: var(--font-sans); font-size: 0.95rem;
  color: var(--text-main); background: #fff; transition: all 0.2s ease;
}
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.05); }
.sort-box { display: flex; align-items: center; gap: 0.5rem; }
.sort-box label { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
.sort-box select {
  padding: 0.6rem 2rem 0.6rem 1rem; border: 1px solid #EAEAEA; border-radius: 4px;
  font-family: var(--font-sans); font-size: 0.95rem; color: var(--text-main);
  background-color: #fff; cursor: pointer; appearance: none;
  background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
  background-repeat: no-repeat; background-position: right 0.7rem top 50%; background-size: 0.65rem auto;
}
.sort-box select:focus { outline: none; border-color: var(--accent); }
@media (max-width: 768px) { .controls-bar { flex-direction: column; align-items: stretch; } .sort-box { justify-content: space-between; } }
  </style>
</head>
<body>

  <!-- Header -->
  <header id="header">
    <div class="header-inner">
      <a href="/" class="logo">Vivek H Sutar</a>
      <nav class="nav-links">
        <a href="about">About</a>
        <a href="books">Books</a>
        <a href="op-eds" class="active">Op-Eds</a>
        <a href="media">Media</a>
        <a href="contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <section class="archive-header">
      <h1>Op-Ed Archive</h1>
      <p>A chronological collection of my articles, columns, and public commentary across regional and national publications.</p>
    </section>

    <!-- Filter Buttons -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="ai">AI & Tech</button>
      <button class="filter-btn" data-filter="policy">Public Policy</button>
      <button class="filter-btn" data-filter="society">Society</button>
      <button class="filter-btn" data-filter="marathi">Marathi</button>
      <button class="filter-btn" data-filter="english">English</button>
    </div>

    <!-- Search and Sort Controls -->
    <div class="controls-bar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Search by title, publication, or keyword...">
      </div>
      <div class="sort-box">
        <label for="sort-select">Sort</label>
        <select id="sort-select">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="az">A-Z (Title)</option>
          <option value="publication">Publication</option>
        </select>
      </div>
    </div>

    <!-- The Grid where JS will inject the cards -->
    <div class="oped-grid" id="oped-grid">
      <!-- Cards will be generated here -->
    </div>
  </main>

  <!-- Footer -->
  <footer id="footer">
    <div class="container">
      <p>&copy; 2026 Vivek H Sutar. All rights reserved.</p>
    </div>
  </footer>

  <!-- JavaScript for Data and Filtering -->
  <script>
    // 1. THE DATA: You just add items to this list later!
    const opeds = [
      {
        title: "स्टारलिंक करार",
        publication: "Punyanagari",
        date: "30 Nov 2025",
        language: "Marathi",
        format: "Print",
        topic: "ai",
        link: "images/स्टारलिंक करार_1B3C70A.jpg" // Link to a PDF or online article
      },
      {
        title: "डिजिटल सुरक्षेची झाकली मूठ",
        publication: "Sakaal",
        date: "18 Apr 2026",
        language: "Marathi",
        format: "Print",
        topic: "ai",
        link: "images/screencapture-epaper-esakal-smartepaper-UI-clipshare-share-aspx-2026-07-29-14_52_48.png"
      },
      {
        title: "कृत्रिम प्रज्ञेचा 'पायाभूत' पैलू ",
        publication: "Sakaal",
        date: "13 Feb 2026",
        language: "Marathi",
        format: "Print",
        topic: "policy",
        link: "images/558_150_1906_1264.jpg"
      },
      {
        title: "'एआय' युगात सत्याची नवी घडण ",
        publication: "Sakaal",
        date: "18 Oct 2025",
        language: "Marathi",
        format: "Print",
        topic: "ai",
        link: "images/screencapture-epaper-esakal-smartepaper-UI-clipshare-share-aspx-2026-07-29-14_56_24.png"
      },
      {
  title: "नवतंत्रज्ञानाच्या क्षेत्रात सर्जनशीलतेची गरज",
  publication: "Sakaal",
  date: "10 Jan 2026",
  language: "Marathi",
  format: "Print", // or "Online"
  topic: "policy", // e.g., ai, policy, society
  link: "images/गरज बंडखोर सर्जनशीलतेची.png" // Or a URL if it's an online article
},
      {
  title: "ज्ञानाचा नित्यानित्यविवेक",
  publication: "Sakaal",
  date: "29 Nov 2025",
  language: "Marathi",
  format: "Print", // or "Online"
  topic: "policy", // e.g., ai, policy, society
  link: "images/नित्यनित्य विवेक या नाव ज्ञान चोख_सकाळ_op-ed_29-11-2025.png" // Or a URL if it's an online article
},
      {
  title: "'ए आय', मला पावसात जाऊ दे...!",
  publication: "Sakaal",
  date: "08 Nov 2025",
  language: "Marathi",
  format: "Print", // or "Online"
  topic: "policy", // e.g., ai, policy, society
  link: "images/screencapture-epaper-esakal-smartepaper-UI-clipshare-share-aspx-2026-07-29-14_58_00.png" // Or a URL if it's an online article
},
      {
  title: "आपुलीच 'प्रतिमा' होते...",
  publication: "Sakaal",
  date: "24 Sep 2025",
  language: "Marathi",
  format: "Print", // or "Online"
  topic: "ai", // e.g., ai, policy, society
  link: "images/संमतीशिवाय सर्जनशिलता म्हणजे अतिक्रमणच_Sakal Op-ed.jpg" // Or a URL if it's an online article
}
    ];

    const grid = document.getElementById('oped-grid');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-select');

    let currentFilter = 'all';
    let searchQuery = '';
    let currentSort = 'newest';

    function renderOpEds(data) {
      grid.innerHTML = ''; 
      if(data.length === 0) {
        grid.innerHTML = '<p style="color:#666; padding: 2rem 0;">No results found. Try adjusting your search or filters.</p>';
        return;
      }
      data.forEach(item => {
        const formatBadgeClass = item.format.toLowerCase() === 'print' ? 'badge-print' : 'badge-online';
        const formatIcon = item.format.toLowerCase() === 'print' ? 'fa-newspaper' : 'fa-globe';
        const cardHTML = `
          <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="oped-card">
            <h3 class="oped-title">${item.title}</h3>
            <div class="oped-meta">
              <span><strong>${item.publication}</strong></span>
              <span>&bull;</span>
              <span>${item.date}</span>
            </div>
            <div class="badges">
              <span class="badge ${formatBadgeClass}"><i class="fas ${formatIcon}"></i> ${item.format}</span>
              <span class="badge badge-lang">${item.language}</span>
            </div>
          </a>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    function processAndRenderData() {
      let processedData = [...opeds];

      if (currentFilter !== 'all') {
        if (currentFilter === 'marathi' || currentFilter === 'english') {
          processedData = processedData.filter(item => item.language.toLowerCase() === currentFilter);
        } else {
          processedData = processedData.filter(item => item.topic === currentFilter);
        }
      }

      if (searchQuery.trim() !== '') {
        const query = searchQuery.toLowerCase();
        processedData = processedData.filter(item => {
          return item.title.toLowerCase().includes(query) || 
                 item.publication.toLowerCase().includes(query) ||
                 item.topic.toLowerCase().includes(query);
        });
      }

      processedData.sort((a, b) => {
        const dateA = new Date(a.date);
        const dateB = new Date(b.date);
        switch (currentSort) {
          case 'newest': return dateB - dateA;
          case 'oldest': return dateA - dateB;
          case 'az': return a.title.localeCompare(b.title);
          case 'publication': return a.publication.localeCompare(b.publication);
          default: return 0;
        }
      });

      renderOpEds(processedData);
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        processAndRenderData();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      processAndRenderData();
    });

    sortSelect.addEventListener('change', (e) => {
      currentSort = e.target.value;
      processAndRenderData();
    });

    processAndRenderData();
  </script>
</body>
</html>
